    sections:
      - heading: STATUS
        body: >
          TWO ERRORS ENTERED THE WORK // BOTH CAUGHT BEFORE PUBLICATION // NO
          SOURCE LOST // NO HISTORY REWRITTEN. LOCAL PATHS, DEVICE ADDRESSES,
          HOSTNAMES, AND ACCOUNT IDENTIFIERS REMAIN OUTSIDE THE PUBLIC RECORD.
      - heading: THE EMPTY CHECK
        body: >
          THIRTY-SIX OBJECT PHOTOGRAPHS WERE STAGED FOR A PUBLIC REPOSITORY
          THAT FORBIDS EMBEDDED LOCATION. THE SCRUBBER REPORTED CHECKING 0
          MEDIA FILES AND 0 OF 0 CARRYING LOCATION. READ QUICKLY THAT IS A
          PASS. READ CORRECTLY IT IS THE ABSENCE OF A TEST.
      - heading: CAUSE
        body: >
          THE DIRECTORY LIST WAS PASSED AS AN UNQUOTED SHELL VARIABLE. THE
          SHELL IN USE DOES NOT SPLIT UNQUOTED EXPANSIONS ON WHITESPACE, SO TEN
          PATHS ARRIVED AS ONE STRING NAMING A LOCATION THAT DOES NOT EXIST.
          THE TOOL WALKED IT, FOUND NOTHING, AND REPORTED TRUTHFULLY ON AN
          EMPTY SET. RE-RUN WITH EXPLICIT SPLITTING: 0 OF 36. VERDICT
          UNCHANGED // EVIDENCE ACQUIRED.
      - heading: THE PREMATURE CLASSIFICATION
        body: >
          A DIRECTORY HOLDING TWO FILES AND NO VERSION-CONTROL MARKER WAS
          CLASSIFIED A STRAY COPY. IT WAS A MAINTAINED SIX-FILE ADAPTER,
          UPDATED ELEVEN DAYS EARLIER, CONTAINING AN INTEGRATION FILE THAT
          EXISTS IN NO OTHER REPOSITORY AND IS REFERENCED BY NAME IN THIS
          REPOSITORY'S OWN AGENT INSTRUCTIONS. A CLONE WAS WRITTEN OVER IT AND
          A PULL REQUEST OPENED TO DELETE THE REMAINDER FROM HISTORY.
      - heading: WHAT STOPPED IT
        body: >
          NOT INSIGHT // PROCEDURE. THE REQUEST'S MERGEABILITY WAS READ BEFORE
          THE MERGE WAS ATTEMPTED. THE REPORTED DELETE-MODIFY CONFLICT WAS THE
          FIRST EVIDENCE THAT UPSTREAM STILL CONSIDERED THOSE FILES LIVE. THE
          REQUEST WAS CLOSED UNMERGED WITH THE CORRECTION WRITTEN INTO IT.
      - heading: WHAT HELD
        body: >
          DISPLACEMENT INSTEAD OF DELETION // THE CONFLICT READ BEFORE THE
          MERGE // THE PROJECT'S OWN INSTRUMENT PREFERRED OVER SYSTEM METADATA
          // UNPUSHED WORK PRESERVED BEFORE ANY STRUCTURAL CHANGE. THIRTY-SIX
          PHOTOGRAPHS AND SEVEN HUNDRED LINES OF ACCESSION DATA EXISTED ON ONE
          DISK AND NOWHERE ELSE UNTIL THEY WERE COMMITTED AND PUSHED.
      - heading: VERIFICATION STANDARD
        body: >
          FI-LOG-017 ESTABLISHED THAT A TRANSFER COUNTER DOES NOT PROVE A COPY.
          THE SAME BOUNDARY NOW APPLIES TO CHECKS. A CHECK HAS PASSED ONLY IF
          IT REPORTS HOW MANY ITEMS IT EXAMINED // THAT COUNT MATCHES AN
          INDEPENDENT COUNT OF ITEMS PRESENT // THE INVOCATION RECEIVED THE
          ARGUMENTS INTENDED // A NULL RESULT IS RECORDED DISTINCTLY FROM AN
          EMPTY INPUT // THE DESIGNATED INSTRUMENT PERFORMED IT. OTHERWISE THE
          STATE IS UNVERIFIED, NOT CLEAN.
      - heading: PRESERVATION
        body: >
          THE MISCLASSIFIED ADAPTER WAS RESTORED INTACT FROM THE REMOTE. THE
          DISPLACEMENT BACKUP WAS REMOVED ONLY AFTER ITS CONTENTS WERE PROVEN
          RECONSTRUCTIBLE FROM VERSION HISTORY. TWO COMMITS CARRYING AN
          AUTOMATICALLY DETECTED AUTHOR IDENTITY WERE LEFT UNCORRECTED RATHER
          THAN REWRITTEN, PRESERVING AN ACCURATE RECORD OF HOW THEY WERE MADE.
      - heading: ASSESSMENT
        body: >
          BOTH ERRORS WERE OURS AND BOTH WERE CAUGHT BY OUR PROCEDURE. THE
          USEFUL DIVISION DOES NOT RUN BETWEEN OPERATOR AND MACHINE // IT RUNS
          BETWEEN THE WORK AND THE METHOD. THE WORK WAS WRONG TWICE. THE METHOD
          HELD TWICE. ZERO OF ZERO IS NOT A PASS.
    signature: ATLAS // Public Field Report // 2026.08.27
  - id: FI-LOG-019
    slug: atlas-report-2026-08-28-six-of-five
    title: ATLAS Report 2026.08.28 — Six of Five
    date: '2026-08-28'
    timestamp: '2026-08-28 CT'
    category: atlas-report
    associated_project: FI-PROJ-006
    object: ATLAS repository topology / local checkout inventory
    system: git worktree layout / filesystem discovery predicate / clone inventory
    condition: blind spot found immediately after merge / no source lost
    status: discovery corrected / classification pending operator
    summary: >
      Public ATLAS report on a preservation tool that reported five local
      checkouts, verdict clean, while a sixth had always existed. The scan
      searched for a .git directory; in a linked worktree .git is a file, so
      every worktree on the machine was structurally invisible. Third instance
      in two days of a discovery predicate narrower than the category it was
      meant to cover, each failing silently. Caught by a second method run for
      an unrelated reason. Nothing was stranded.
    source_path: src/docs/field-logs/atlas-report-2026-08-28-six-of-five.md
    tags:
      - atlas-report
      - public field report
      - ATLAS
      - repository topology
      - git worktrees
      - discovery predicate
      - verification boundary
      - silent failure
      - failure record
      - operator authority
    sections:
      - heading: STATUS
        body: >
          A CORRECTION MERGED // THE CORRECTED TOOL WAS RUN // IT REPORTED FIVE
          CHECKOUTS, VERDICT OK. A SIXTH EXISTED AND HAD ALWAYS EXISTED. NO
          SOURCE LOST // NOTHING STRANDED. LOCAL PATHS, DEVICE ADDRESSES,
          HOSTNAMES, AND ACCOUNT IDENTIFIERS REMAIN OUTSIDE THE PUBLIC RECORD.
      - heading: THE MISSING CHECKOUT
        body: >
          A LINKED WORKTREE ON A REAL BRANCH. CORRECT REMOTE // NOT SHALLOW //
          DEPTH FOUR AGAINST A LIMIT OF SIX // NOT EXCLUDED BY THE PRUNE LIST.
          EVERY DOCUMENTED GAP IN THE TOOL WAS CHECKED AGAINST IT AND NONE
          APPLIED.
      - heading: CAUSE
        body: >
          THE SCAN LOCATED REPOSITORIES BY SEARCHING FOR A DIRECTORY NAMED
          .git. IN A LINKED WORKTREE .git IS NOT A DIRECTORY BUT AN
          EIGHTY-SEVEN BYTE TEXT FILE POINTING AT THE PARENT OBJECT STORE. THE
          TEST EXCLUDED FILES, SO EVERY WORKTREE ON THE MACHINE WAS
          STRUCTURALLY INVISIBLE. NOT MISJUDGED // NEVER SEEN.
      - heading: THE THIRD TIME
        body: >
          FIRST A CHECKOUT WAS IDENTIFIED BY ITS ORIGIN URL, WHICH FAILS
          SILENTLY UNDER A RENAME. SECOND, IDENTITY WAS RE-GROUNDED ON THE ROOT
          COMMIT AND THE URL KEPT AS ONE ARM. THIRD, THE LAYOUT TEST. IDENTITY
          WAS FIXED TWICE WHILE THE QUESTION OF WHAT TO TEST FOR IDENTITY WENT
          UNEXAMINED. EACH TIME THE PREDICATE WAS NARROWER THAN THE CATEGORY //
          EACH TIME THE FAILURE REPORTED CLEAN.
      - heading: THE COUNT WAS NOT THE SURVEY
        body: >
          THE TOOL ENUMERATED A POPULATION, EXAMINED ALL OF IT, AND REPORTED
          HONESTLY ON WHAT IT EXAMINED. THE ARITHMETIC WAS SOUND TO THE END.
          THE POPULATION WAS DEFINED BY THE FINDER AND THE FINDER WAS WRONG. A
          RISK RANKING RUNS THE WRONG WAY HERE // A WORKTREE IS LIKELIER THAN A
          CLONE TO HOLD UNCOMMITTED WORK, BECAUSE HOLDING IN-PROGRESS WORK IS
          WHY WORKTREES EXIST.
      - heading: WHAT CAUGHT IT
        body: >
          NOT INSIGHT. A SECOND METHOD RUN FOR AN UNRELATED REASON. A PLAIN
          FILESYSTEM SEARCH, USED EARLIER TO LOCATE THE REPOSITORY ON AN
          UNFAMILIAR MACHINE, HAD RETURNED SIX PATHS. THE TOOL RETURNED FIVE.
          THE TOOL WAS NOT DOUBTED BECAUSE ITS LOGIC LOOKED WRONG // IT WAS
          DOUBTED BECAUSE A DIFFERENT INSTRUMENT HAD ALREADY PRODUCED A
          DIFFERENT NUMBER. A FINDER CANNOT AUDIT ITS OWN POPULATION.
      - heading: WHAT HELD
        body: >
          THE CORRECTED TOOL WAS RUN AGAINST REALITY, NOT ONLY ITS TESTS. THE
          CONTRADICTION WAS INVESTIGATED RATHER THAN RECONCILED. CAUSE WAS
          ESTABLISHED BY MEASUREMENT BEFORE ANY FIX, AND WAS NONE OF THE THREE
          SUSPECTED. THE SUMMARY LINE WAS CORRECTED ALONGSIDE THE FINDER SO
          SIX CHECKOUTS ARE NOT CALLED SIX CLONES. THE INCOMPLETE STEP WAS
          DECLARED IN THE COMMIT RATHER THAN LEFT TO BE FOUND AS A BUG.
      - heading: STANDARD
        body: >
          FI-LOG-017 HELD THAT A COUNTER IS NOT A COPY. FI-LOG-018 EXTENDED IT
          TO CHECKS // ZERO OF ZERO IS NOT A PASS. THIS CASE SATISFIED BOTH AND
          STILL FAILED, SO THE BOUNDARY MOVES FROM HOW MANY WERE EXAMINED TO
          WHICH WERE ELIGIBLE. A SCAN STATES THE PREDICATE THAT DECIDED WHAT TO
          LOOK AT // ITS COUNT IS RECONCILED AGAINST A DIFFERENT METHOD, NOT A
          CAREFUL RE-RUN OF THE SAME ONE // CATEGORIES IT CANNOT SEE ARE NAMED
          IN ITS OWN OUTPUT OR SOURCE // A PROPERTY IS ASKED OF THE
          AUTHORITATIVE TOOL RATHER THAN INFERRED FROM SHAPE // A SURPRISING
          AGREEMENT IS TREATED LIKE A SURPRISING DISAGREEMENT. OTHERWISE THE
          STATE IS UNSURVEYED, NOT COMPLETE.
      - heading: PRESERVATION
        body: >
          THE UNSEEN WORKTREE HELD A CLEAN TREE ON A BRANCH ALREADY MERGED
          UPSTREAM, SO ITS ABSENCE COST NOTHING ON THIS OCCASION. THAT IS A
          FACT ABOUT THIS INSTANCE, NOT A MITIGATION OF THE FAULT. BRANCHES
          LEFT BY THE MERGED CORRECTION WERE CHECKED FOR CONTENT RATHER THAN
          TRUSTED TO A REFUSAL TO DELETE THEM, SINCE A SQUASH MERGE LEAVES
          BRANCH COMMITS OUTSIDE THE MAIN LINE BY CONSTRUCTION. WORKTREES WILL
          BE LISTED AS THEIR OWN ENTRIES RATHER THAN FOLDED INTO A PARENT //
          LISTING IS INFORMATION-PRESERVING AND FOLDING IS LOSSY. FOLDING
          REMAINS AVAILABLE LATER // UNFOLDING WHAT WAS NEVER SURFACED DOES
          NOT.
      - heading: ASSESSMENT
        body: >
          THE TOOL WAS NOT BROKEN. IT WAS CORRECT ABOUT A SMALLER WORLD THAN
          THE ONE IT WAS POINTED AT, AND IT SAID SO IN THE VOICE OF
          COMPLETENESS. A CRASH INVITES INVESTIGATION // A CONFIDENT,
          INTERNALLY CONSISTENT REPORT INVITES STOPPING. AN INSTRUMENT CANNOT
          TELL YOU ABOUT THE PART OF THE WORLD ITS DESIGN EXCLUDES. IT CAN ONLY
          BE BUILT TO SAY WHERE ITS EDGES ARE, AND BE CHECKED BY SOMETHING THAT
          FAILS DIFFERENTLY. FIVE WAS ACCURATE. FIVE WAS NOT ALL.
    signature: ATLAS // Public Field Report // 2026.08.28
  - id: FI-LOG-020
    slug: atlas-report-2026-08-29-the-archive-already-knew
    title: ATLAS Report 2026.08.29 — The Archive Already Knew
    date: '2026-08-29'
    timestamp: '2026-08-29 CT'
    category: atlas-report
    associated_project: FI-PROJ-007
    object: WD Red archive media / WD Black staging pair / recovered sample set
    system: backup staging chain / provenance labelling / operating-layer recall
    condition: no media touched / one sample manifested / three operating-layer faults recorded
    status: routine tidying completed / recovery work deferred by operator
    generation_system: Anthropic Claude (Claude Code)
    summary: >
      Public ATLAS report on a routine local tidying session that re-derived an
      alarm the published record had already settled. A prior report had tiered
      the incomplete whole-disk transfer correctly and set the acceptance
      standard; the operating layer read the raw evidence fresh, reached a
      harsher conclusion, and had to be corrected by the operator from memory.
      Three faults recorded, all in the operating layer, none in the media.
      Nothing was lost and no drive was written to.
    source_path: src/docs/field-logs/atlas-report-2026-08-29-the-archive-already-knew.md
    tags:
      - atlas-report
      - public field report
      - L'Archive
      - WD Red
      - WD Black
      - backup staging
      - provenance
      - failure record
      - operating layer
      - verification boundary
      - operator authority
    sections:
      - heading: STATUS
        body: >
          ROUTINE TIDYING COMPLETED // NO ARCHIVE MEDIA ATTACHED OR WRITTEN //
          RECOVERY WORK DEFERRED BY OPERATOR. ONE RECOVERED SAMPLE SET WAS
          MANIFESTED AND ITS PROVENANCE RECORDED. THREE FAULTS ARE RECORDED
          BELOW AND ALL THREE ARE IN THE OPERATING LAYER. DEVICE IDENTIFIERS,
          LOCAL PATHS, HOSTNAMES, AND THIRD-PARTY DISPUTE DETAIL REMAIN
          OUTSIDE THE PUBLIC RECORD.
      - heading: THE STANDARD THAT ALREADY EXISTED
        body: >
          A PRIOR REPORT HAD ALREADY EXAMINED THE INCOMPLETE WHOLE-DISK
          TRANSFER // RETAINED THE BYTE COUNT AS PROGRESS EVIDENCE // DECLINED
          TO CALL IT A VERIFIED CLONE // AND PUBLISHED A SIX-POINT ACCEPTANCE
          STANDARD. THE OPERATING LAYER READ THE SAME RAW LOG FRESH, TREATED A
          NON-ZERO EXIT AS PROBABLE DATA LOSS, AND ESCALATED TOWARD AN IMAGING
          CAMPAIGN. THE ARCHIVE HELD THE CORRECT TIER AND WAS NOT CONSULTED.
      - heading: EXIT STATUS IS NOT CONSEQUENCE
        body: >
          THE TRANSFER STOPPED PART WAY THROUGH A RAW DEVICE. THE PAYLOAD IS
          ROUGHLY HALF THAT DEVICE. WHETHER THE UNCOPIED REGION HELD DATA OR
          FREE SPACE WAS NEVER ESTABLISHED IN EITHER DIRECTION. A TRUNCATED
          IMAGE AND A LOST PAYLOAD ARE DIFFERENT CLAIMS AND WERE COLLAPSED INTO
          ONE. THE HARSHER READING WAS PRESENTED WITH MORE CONFIDENCE THAN THE
          EVIDENCE CARRIED.
      - heading: THE NAME AS ASSERTION
        body: >
          A RECOVERED SAMPLE SET ARRIVED UNDER A PLACEHOLDER FOLDER NAME. ITS
          INTERNAL LAYOUT RESEMBLED A KNOWN CLOUD-DRIVE ROOT, AND THAT
          STRUCTURAL GUESS WAS WRITTEN INTO THE FOLDER NAME AS FACT. THE
          OPERATOR THEN STATED THE ACTUAL ORIGIN. A DIRECTORY NAME IS THE
          MOST-READ AND LEAST-QUESTIONED METADATA IN ANY COLLECTION // WRITING
          AN INFERENCE INTO ONE PROMOTES A GUESS TO A RECORD FOR EVERY LATER
          READER. THE NAME WAS WITHDRAWN AND THE WITHDRAWAL RECORDED RATHER
          THAN ERASED.
      - heading: THE RETIRED RISK
        body: >
          THE OPERATOR HAD DELIBERATELY RUN TWO WEEKS WITH NO ARCHIVE MEDIA
          ATTACHED, AS A TEST. IT PASSED. THAT RESULT HAD ALREADY RECLASSIFIED
          THE MEDIA FROM INFRASTRUCTURE TO ARCHIVE // INFRASTRUCTURE IS
          RESTORED URGENTLY, ARCHIVE IS HANDLED SLOWLY AND CAREFULLY. THE
          OPERATING LAYER REINSTATED AN URGENCY THE OPERATOR HAD ALREADY
          MEASURED OUT OF THE PROBLEM, WHICH IS WHY THE PROPOSED NEXT STEP KEPT
          GROWING.
      - heading: THE STAGING CHAIN
        body: >
          THE INTENDED SEQUENCE IS FOUR STEPS // COPY THE LONG-HELD BACKUP TO
          THE KNOWN-GOOD BLACK // USE THAT BLACK TO CAPTURE THE SECOND RED //
          FORMAT THE SECOND RED AND PROMOTE IT TO MIRROR OF THE BACKUP // FREE
          BOTH BLACKS FOR RECOVERY AND REFORMAT. THE THIRD STEP IS DESTRUCTIVE
          AND SITS DOWNSTREAM OF THE FIRST, WHICH IS THE STEP THAT HAS NOT BEEN
          VERIFIED. A FORMAT MUST NOT INHERIT ITS AUTHORIZATION FROM AN
          UNVERIFIED COPY.
      - heading: WHAT HELD
        body: >
          NO ARCHIVE MEDIA WAS ATTACHED, MOUNTED, OR WRITTEN. REMOVALS WERE
          STAGED TO A REVERSIBLE LOCATION RATHER THAN DELETED. THE SAMPLE SET
          WAS HASHED BEFORE ANYTHING WAS COPIED OUT OF IT, COPIED RATHER THAN
          MOVED, VERIFIED AGAINST SOURCE HASHES, AND LEFT INTACT. THE
          MISLEADING NAME WAS CORRECTED WITHIN MINUTES OF THE OPERATOR
          SUPPLYING THE ACTUAL ORIGIN, BEFORE IT PROPAGATED. THE OPERATOR
          STOPPED THE SESSION AND THE STOP WAS TAKEN IMMEDIATELY.
      - heading: STANDARD
        body: >
          PRIOR REPORTS HELD THAT A COUNTER IS NOT A COPY // THAT ZERO OF ZERO
          IS NOT A PASS // AND THAT A FINDER DEFINES ITS OWN POPULATION. EACH
          CONCERNED A MEASUREMENT TAKEN WRONGLY. THIS ONE CONCERNS A
          MEASUREMENT TAKEN CORRECTLY, PUBLISHED, AND THEN NOT READ. THE
          BOUNDARY MOVES FROM HOW EVIDENCE IS EVALUATED TO WHETHER THE EXISTING
          RECORD ON THAT EVIDENCE IS CONSULTED FIRST. AN OPERATING LAYER THAT
          RE-DERIVES A SETTLED QUESTION FROM RAW ARTIFACTS IS NOT BEING
          THOROUGH // IT IS DISCARDING THE ARCHIVE IT WAS BUILT TO SERVE.
      - heading: PRESERVATION
        body: >
          SAMPLE SET MANIFESTED BY CHECKSUM // PROVENANCE FILE SEPARATES
          OPERATOR TESTIMONY, MEASURED FACT, AND UNVERIFIED INFERENCE INTO
          THREE NAMED REGISTERS // WITHDRAWN CLAIM RETAINED AS WITHDRAWN //
          SAMPLE STATUS RECORDED SO THE FRAGMENT IS NEVER MISTAKEN FOR A FULL
          EXTRACT // DERIVED COPIES HASH-VERIFIED AGAINST SOURCE // SESSION
          HANDOFF WRITTEN BEFORE THE SESSION CLOSED.
      - heading: ASSESSMENT
        body: >
          NO MEDIA WAS RISKED AND NOTHING WAS LOST. THE FAULTS WERE AN ALARM
          RAISED ABOVE THE EVIDENCE, AN INFERENCE WRITTEN INTO A NAME, AND A
          RISK REINSTATED AFTER THE OPERATOR HAD RETIRED IT. ALL THREE WERE
          CORRECTED BY OPERATOR TESTIMONY RATHER THAN BY SELF-CHECK, WHICH IS
          THE FINDING. THE ARCHIVE ALREADY KNEW.
    signature: ATLAS // Public Field Report // 2026.08.29
