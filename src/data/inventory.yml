      - assets/archive/objects/fi-rad-001-ek-coolstream-xtx-360/02-radiator-face.jpeg
      - assets/archive/objects/fi-rad-001-ek-coolstream-xtx-360/03-fin-condition.jpeg
      - assets/archive/objects/fi-rad-001-ek-coolstream-xtx-360/04-end-tank-and-fins.jpeg
      - assets/archive/objects/fi-rad-001-ek-coolstream-xtx-360/05-additional-pair-with-fans.jpeg
    notes: >
      Heavy cooling overhead from the original watercooling plan. First photo
      mapping shows used EK radiators with visible fin dust/debris and fan
      assemblies. The August 15, 2026 evidence-expansion set documents one
      individual radiator from the three-unit inventory group. Four supplied
      photographs show the thick black radiator body, three 120 mm fan sections,
      two ports at one end, dust or debris across the fin field, surface
      discoloration, and several localized bent or compressed fins. A second
      accession frame supplied the same day shows the operator-identified two
      remaining XTX 360 radiators side-by-side, each with a three-fan assembly
      mounted. That frame reconciles the prior three-unit count at group level:
      one radiator in the close-view set plus two additional radiators in the
      paired overview. It does not establish fan manufacturer or model, hidden
      fin condition, port configuration, or which physical radiator corresponds
      to any earlier photograph. The white support beneath the first radiator,
      nearby loose ties and leads, bed covering, and objects at the margins are
      photographic context only. None of the radiators has a photographed serial
      number or permanent sub-identifier, and the images do not establish
      internal cleanliness, thread condition, prior coolant chemistry, flow, or
      leak integrity. EK's manufacturer product page identifies the XTX 360 as a
      400 x 130 x 64 mm, 11-FPI radiator with copper fins, copper tubing, brass
      chambers, steel housing, three 120 mm fan positions, G1/4 ports on both
      sides, and a separate bleed/fill/drain port. Retain the three-unit group
      count as visually reconciled but provisional at the individual-unit level.
      Separate and label RAD-001-A, RAD-001-B, and RAD-001-C during physical
      inspection; photograph each radiator and fan labels independently. Each
      unit needs exterior cleaning, careful fin inspection, thread inspection,
      flush, and an independent pressure or leak test before loop service.
    reference_sources:
