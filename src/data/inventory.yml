      identity is therefore 1900 Indian Head cent. The coin remains in a stapled
      white cardboard 2x2 holder. Its visible surfaces show circulated wear,
      brown coloration, marks, and areas of discoloration. These photographs do
      not establish authenticity, exact composition, weight, diameter, edge
      condition, die variety, mint of manufacture, alteration, cleaning,
