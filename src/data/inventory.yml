      handwritten $20 is recorded only as a prior holder or asking-price
      annotation; it is not an appraisal, verified sale price, or current value.
      A separate handwritten "4x" notation is visible but remains uninterpreted.
      A read-only review of authenticated eBay purchase history on 2026-08-15
      returned no matching order for searches "1900," "Indian," or "cent."
      Acquisition provenance therefore remains uncorroborated; this negative
      keyword result does not prove nonpurchase because generic live-auction
      titles may omit the physical object's identity.
      Do not clean, polish, dip, or otherwise alter the coin. Preserve it in the
      current holder until a controlled inspection can photograph both faces and
      the edge and record weight and diameter; if rehoused, use an inert archival
      coin holder and preserve the annotated original holder as associated
