    notes: >
      ACCESSION 009. This accession attaches seven newly supplied July 18, 2026
      Apple Photos derivative frames to the existing FI-HW-MB-X99-001 object;
      it does not create a duplicate motherboard record. The photographs show
      the MSI X99S XPOWER AC E-ATX board in a clear plastic storage tray with an
      installed and latched processor, all eight DDR4 DIMM slots empty, the
      onboard two-digit diagnostic display and OC controls present, and the
      24-pin ATX and CPU-power sockets unconnected. Surface dust, lint, and
      residual material are visible in several areas. A separate direct
      heat-spreader photograph previously identified the seated processor as
      FI-HW-CPU-X99-001, an Intel Core i7-5930K / SR20R / 3.50 GHz; the new
      frames do not independently establish that marking. Recovered records and
      operator identification establish that the board operated in the 2014
      test-bench system. It later became difficult to configure and would not
      boot reliably; the historical cause was never established, and no
      electrical failure was confirmed. The platform is the historically
      intended compute core for LE RÉDEMPTEURE, the main Mercury S8 cube within
      L’ARCHIVE, the artwork as a whole. As of July 30, 2026, the board remains
      in its plastic storage tray with the i7-5930K seated and the socket
      latched; only a preliminary wipe of old thermal paste from the heat
      spreader has occurred. A local intake from one ammo can and one Tupperware
      visibly establishes custody of loose HyperX Fury and Corsair Vengeance
      LPX DDR4, but exact capacities, speeds, part numbers, compatibility, and
      function remain unconfirmed. No power-on has occurred during the current
      recovery pass, and the photographs do not establish POST, firmware state,
      connector function, control function, or stability. Move the board to a
      rigid nonconductive bench surface before power. Preserve it as a repair
      candidate until dry visual inspection, CMOS reset, minimum bench
      configuration, and diagnostic-code capture are complete. The seven
      supplied files are Apple Photos derivative cache JPEGs, not unmodified
      camera originals; exact unsanitized copies are retained locally outside
      the public tree, while the registered derivatives have location metadata
      removed.
