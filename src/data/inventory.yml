      - assets/archive/objects/fi-cl-part-002-120-flex-bay-4x-hdd-cage/02-cage-front.jpeg
    notes: >
      Two August 15, 2026 photographs expand the existing provisional CaseLabs
      accessory record rather than creating a second cage object. The images
      show a white powder-coated open-sided cage with four vertically stacked
      3.5-inch drive positions, black vibration-isolation grommets along both
      side panels, a black fan mounted across the lower plate, an attached fan
      lead, and multiple retained fasteners. The fan label carries visible
      Corsair branding, consistent with the prior operator identification as a
      Corsair static-pressure fan, but the exact model, electrical rating, and
      connector are not legible enough in these frames for a definitive model
      assignment. The assembly remains a candidate for the front-right
      pedestal storage position. The photographs do not establish the exact
      historical CaseLabs retail name, grommet count or condition on hidden
      faces, loose-hardware completeness, thread integrity, fan function,
      installed airflow direction, drive fitment, or chassis fitment. Two
      stripped or thread-damaged screws were previously reported, but these
      frames do not isolate them clearly. Do not attempt removal until their
      positions, heads, and surrounding threads have been photographed closely.
    reference_sources:
