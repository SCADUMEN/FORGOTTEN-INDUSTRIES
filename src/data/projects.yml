  - id: FI-PROJ-009
    slug: x99-impact-recovery
    title: LE RÉDEMPTEURE / X99 Recovery Dossier
    working_title: LE RÉDEMPTEURE / X99 SYSTEM Restoration
    category: Hardware Recovery Dossier
    status: intake / fault isolation pending
    started: '2026'
    summary: >
      Recovery dossier for the intended X99 compute platform of LE
      RÉDEMPTEURE, the boutique hardline-cooled main cube of the CaseLabs
      Mercury S8 artwork L’ARCHIVE. The record also preserves an ASUS ROG
      Maximus VI Impact with its matching EK-FB ASUS M6I monoblock, a separate
      Maximus VII Impact with modular audio hardware, and an operator-identified
      EVGA GTX 660 Ti fitted with an EK-FC670 GTX full-cover water block.
    origin:
      context: >
        The hardware re-entered the Forgotten Industries bench in July 2026.
        Recovered records and operator identification establish that the X99
        platform operated in the 2014 test-bench system and was the historically
        intended successor compute platform for the Mercury S8 restoration. It
        later became difficult to configure and would not boot reliably, leading
        the operator to replace it with the i7-6700K platform later documented
        as REDEEMER. No historical diagnosis established an electrical fault,
        and no current component is represented as working until controlled
        bench validation is complete. As of July 30, 2026, the 5930K remains
        seated and latched, the board is stored in its plastic tray with zero
        RAM installed, and no power-on has occurred during the current recovery
        pass. JJAMMOCAN remains the continuity platform until X99 stability is
        established beyond a single POST.
    themes:
      - old hardware recovery
      - X99 fault isolation
      - L’ARCHIVE
      - LE RÉDEMPTEURE
      - mini-ITX platform preservation
      - custom watercooling
      - evidence before repair
      - bench validation
      - uncertainty preservation
    artifacts:
      - FI-HW-MB-X99-001
      - FI-HW-CPU-X99-001
      - FI-HW-MB-Z87-001
      - FI-HW-MB-Z97-001
      - FI-HW-BLOCK-Z87-001
      - FI-HW-GPU-660TI-001
    source_links:
      - label: Source dossier
        type: local
        role: public working dossier
        path: src/projects/x99-impact-recovery/README.md
    documentation_style:
      - Preserve the known failure history before attempting repair
      - Keep confirmed CPU identity separate from the still-unverified function claim
      - Photograph sockets, labels, debug codes, and test configuration before changing parts
      - Bench-test with minimum known-good hardware and no storage devices attached
      - Treat water blocks as unvalidated cooling artifacts until cleaned and pressure-tested

