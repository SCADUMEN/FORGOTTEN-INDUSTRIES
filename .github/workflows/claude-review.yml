name: Claude PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Read-only review
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Forgotten-Industries' &&
      startsWith(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review pull request with Claude
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: Forgotten-Industries
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: ${{ github.event.issue.number }}

            Review this pull request read-only. Do not modify files, create
            commits, push branches, open pull requests, change settings, or
            expose credentials or private material.

            Read AGENTS.md, CLAUDE.md, and README.md before reviewing. Treat
            intake media, local transcripts, work directories, credentials,
            private messages, and machine-local paths as out of scope. Review
            only the public PR diff and public repository context.

            Focus on correctness, regressions, security, privacy, accessibility,
            responsive behavior, public-release safety, and Forgotten Industries
            evidence integrity. Do not promote inference, machine transcription,
            or an unverified state into a verified claim.

            Post inline comments only for specific, actionable findings. Post one
            concise top-level summary with blocking findings first, then
            non-blocking findings, followed by what could not be verified. For
            every finding include severity, exact file and line, evidence,
            impact, and the smallest safe fix. Do not invent findings. If there
            are no blockers, say so explicitly.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
