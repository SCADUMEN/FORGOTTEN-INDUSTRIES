name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify Worker
    if: github.repository == 'SCADUMEN/FORGOTTEN-INDUSTRIES'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker-production
      url: https://forgotten-industries.net

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Setup Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy archive
        run: npm run build:site

      - name: Audit public release surface
        run: npm run audit:public

      - name: Validate Worker asset bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.112.0'
          command: deploy

      - name: Verify production custom domain
        run: npm run verify:worker -- https://forgotten-industries.net

      - name: Verify workers.dev noindex boundary
        run: npm run verify:worker -- https://forgotten-industries.bagelmanrichard.workers.dev
