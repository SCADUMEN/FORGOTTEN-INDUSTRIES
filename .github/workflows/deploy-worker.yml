name: Deploy Cloudflare Worker

# Deploys only after CI passes on a push to main, so a red build never ships.
# workflow_run checks out the default branch by default, so the checkout pins
# the exact commit CI tested. A manual dispatch is allowed from main only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify Worker
    if: >-
      github.repository == 'SCADUMEN/FORGOTTEN-INDUSTRIES' &&
      (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker-production
      url: https://forgotten-industries.net
    env:
      PRODUCTION_URL: https://forgotten-industries.net
      WORKERS_DEV_URL: https://forgotten-industries.bagelmanrichard.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Setup Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: npm ci

      # build:site ends with the public-surface audit (audit:public).
      - name: Build Eleventy archive
        run: npm run build:site

      - name: Validate Worker asset bundle
        run: npx wrangler deploy --dry-run

      # Runs before the deploy so new code never meets an old schema. Targets
      # the binding, not the database name, so a rename needs no change here.
      # Migrations are IF NOT EXISTS and tracked in d1_migrations, so a deploy
      # with nothing new applies nothing. Uses its own token, scoped to D1 Edit
      # only, so the deploy token doesn't need database write access.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production custom domain
        run: npm run verify:worker -- "$PRODUCTION_URL"

      - name: Verify workers.dev noindex boundary
        run: npm run verify:worker -- "$WORKERS_DEV_URL"
